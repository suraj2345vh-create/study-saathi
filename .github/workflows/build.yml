name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: unzip -q -o "$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -1)"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
        working-directory: StudySaathi
      - uses: actions/upload-artifact@v4
        with:
          name: StudySaathi-apk
          path: StudySaathi/app/build/outputs/apk/debug/*.apk
